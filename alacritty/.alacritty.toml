[window]
opacity = 1
padding = { x = 0, y = 25 }
#padding = { x = 750, y = 25 }
dynamic_padding = true
decorations = "Buttonless"
blur = false
option_as_alt = "Both"

[font]
normal = { family = "JetBrainsMono Nerd Font", style = "ExtraLight" }
bold = { family = "JetBrainsMono Nerd Font", style = "Bold" }
italic = { family = "JetBrainsMono Nerd Font", style = "Thin Italic" }
offset = { x = -2, y = -2 }
size = 12

[colors.primary]
foreground = "0xdfbf8e"
background = "0x282828"

[env]
term = "alacritty"

# Ctrl+Tab / Ctrl+Shift+Tab switch browser tabs; in the terminal they switch
# tmux windows instead (prefix C-a, then C-p next / C-n previous).
[keyboard]
bindings = [
  { key = "Tab", mods = "Control", chars = "\u0001\u0010" },
  { key = "Tab", mods = "Control|Shift", chars = "\u0001\u000e" },
]
